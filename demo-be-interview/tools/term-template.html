<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #010409;
    display: flex;
    align-items: stretch;
    justify-content: stretch;
    padding: 14px;
    font-family: "SF Mono", "JetBrains Mono", Menlo, Monaco, "Courier New", monospace;
  }
  .window {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
  }
  .titlebar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
  }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .titlebar .label {
    margin-left: 10px;
    color: #8b949e;
    font-size: 14px;
    letter-spacing: 0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #content {
    flex: 1;
    overflow: hidden;
    padding: 20px 22px;
    color: #e6edf3;
    white-space: pre;
    line-height: 1.55;
  }
  body.vert #content { font-size: 18px; }
  body.wide #content { font-size: 16px; }
  body.wide .titlebar .label { font-size: 15px; }
  .hl-label { color: #f2cc60; font-weight: 700; }
  .hl-ok { color: #3fb950; font-weight: 700; }
  .hl-fail { color: #f85149; font-weight: 700; }
</style>
</head>
<body class="__MODE__">
  <div class="window">
    <div class="titlebar">
      <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      <div class="label">__TITLE__</div>
    </div>
    <div id="content">__CONTENT__</div>
  </div>
  <script>
    // Đo overflow sau khi layout xong; term-shot.mjs đọc marker này qua --dump-dom
    // để BÁO LỖI thay vì cắt chữ lặng lẽ.
    window.addEventListener('load', () => {
      const c = document.getElementById('content');
      const oy = c.scrollHeight > c.clientHeight;
      const ox = c.scrollWidth > c.clientWidth;
      const m = document.createElement('div');
      m.id = 'termshot-overflow';
      m.style.display = 'none';
      m.textContent = 'TERMSHOT_OVERFLOW=' + (ox || oy ? (ox ? 'x' : '') + (oy ? 'y' : '') : 'none')
        + ';scrollW=' + c.scrollWidth + ';clientW=' + c.clientWidth
        + ';scrollH=' + c.scrollHeight + ';clientH=' + c.clientHeight;
      document.body.appendChild(m);
    });
  </script>
</body>
</html>
